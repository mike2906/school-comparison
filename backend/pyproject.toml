[project]
name = "sofia-school-compare"
version = "0.1.0"
description = "A bilingual web app for parents in Sofia to discover, filter, and compare kindergartens and schools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "pdfplumber>=0.11.9",
    # Phase 1 scraping dependencies
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.10.0",
    "pydantic-ai>=1.52.0",
    "crawl4ai>=0.8.0",
    # CLI dependencies
    "click>=8.1.0",
    "rich>=13.0.0",
    "cyrtranslit>=1.2.0",
    "tldextract>=5.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "aiosqlite>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
