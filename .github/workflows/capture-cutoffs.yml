name: Capture admission cut-offs

# Saves each Sofia ИСОДЗ round (kindergarten, nursery, ПГУ, first grade) as aggregate rows
# on the cutoff-data branch. kg.sofia.bg keeps only the current school year online, so a
# round missed here is gone. Lists come out at about 17:00 Sofia time on round days; the
# 03:15 run finishes a scan that hit its request budget. Docs: docs/ADMISSION_CUTOFFS.md
on:
  schedule:
    - cron: "15 3,16,21 * * *"
  push:  # TEMP-TEST
    branches: [agent/cutoff-capture]  # TEMP-TEST
  workflow_dispatch:
    inputs:
      force:
        description: Scan every institution even if no round was published
        type: boolean
        default: false

concurrency:
  group: capture-cutoffs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    name: ИСОДЗ rounds
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check out the archive
        uses: actions/checkout@v7
        with:
          ref: cutoff-data
          path: cutoff-archive

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        working-directory: backend
        run: uv sync --locked

      - name: Capture
        working-directory: backend
        timeout-minutes: 95
        run: >-
          uv run python -m scripts.capture_isodz_cutoffs
          --archive ../cutoff-archive
          --max-requests ${{ github.event_name == 'push' && '150' || '4500' }}
          ${{ (inputs.force || github.event_name == 'push') && '--force' || '' }}
          ${{ github.event_name == 'push' && '--only grade_1 preparatory' || '' }}  # TEMP-TEST
          2>&1 | tee "$RUNNER_TEMP/capture.log"

      - name: Report (TEMP-TEST)
        if: always() && github.event_name == 'push'
        run: |
          tail -c 3000 "$RUNNER_TEMP/capture.log" | tr '\n' '|' | sed 's/::/:/g' | xargs -0 -I{} echo "::notice title=log::{}"
          cd cutoff-archive && find . -name '*.json' | head -40 | tr '\n' ' ' | xargs -0 -I{} echo "::notice title=files::{}"
          f=$(find . -name 'round-*.json' | head -1); [ -n "$f" ] && head -c 3500 "$f" | tr '\n' ' ' | xargs -0 -I{} echo "::notice title=sample::{}" || true

      - name: Commit the archive
        if: always()
        working-directory: cutoff-archive
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new rounds."
            exit 0
          fi
          git -c user.name="cut-off capture" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Capture ИСОДЗ rounds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:cutoff-data
