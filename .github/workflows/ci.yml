name: CI

on:
  pull_request:
  push:
    # main is tested by the Deploy workflow, which calls this one.
    branches-ignore: [main]
  workflow_call:
  # draft-rule-update.yml starts it on its branches: GITHUB_TOKEN pushes start nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    # Pinned so the preinstalled PostgreSQL stays at 16, as in docker-compose.yml.
    runs-on: ubuntu-24.04
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start PostgreSQL
        # The runner image ships PostgreSQL 16 (disabled by default). Using it avoids pulling
        # an image: the ECR mirror refuses anonymous pulls with "toomanyrequests" once a
        # shared runner IP passes its data limit, and Docker Hub has its own pull limit.
        run: |
          sudo systemctl start postgresql.service
          pg_isready
          # Over the local socket (peer auth), whatever PG* variables sudo passes on.
          sudo -u postgres psql -h /var/run/postgresql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb -h /var/run/postgresql schooldecider_migrations
          psql --version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: PostgreSQL clean install and populated alignment reapplication
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/schooldecider_migrations
        run: |
          uv run alembic upgrade head --sql > "$RUNNER_TEMP/migrations.sql"
          uv run alembic upgrade head
          uv run alembic check
          psql -U postgres -d schooldecider_migrations -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO countries (code, name_i18n, education_config, map_config, supported_languages, default_language, default_currency, created_at, updated_at)
          VALUES ('bg', '{}', '{}', '{}', '["bg"]', 'bg', 'BGN', now(), now());
          INSERT INTO schools (country_code, name_i18n, school_type, education_level, city)
          VALUES ('bg', '{"bg":"Migration preservation test"}', 'state', 'primary', 'sofia');
          SQL
          before="$(psql -U postgres -d schooldecider_migrations -Atc 'SELECT row_to_json(s)::text FROM schools s ORDER BY id')"
          # The latest downgrade deliberately retains schema; rewind its revision marker
          # so upgrade exercises conditional DDL against existing, populated tables.
          uv run alembic downgrade -1
          uv run alembic upgrade head
          after="$(psql -U postgres -d schooldecider_migrations -Atc 'SELECT row_to_json(s)::text FROM schools s ORDER BY id')"
          test -n "$before" && test "$before" = "$after"
          uv run alembic check

      - name: Verify PostgreSQL backup restore
        run: |
          pg_dump -U postgres -d schooldecider_migrations -Fc > "$RUNNER_TEMP/migrations.dump"
          pg_restore --list < "$RUNNER_TEMP/migrations.dump" > /dev/null
          createdb -U postgres schooldecider_restore
          pg_restore -U postgres -d schooldecider_restore --no-owner --exit-on-error < "$RUNNER_TEMP/migrations.dump"
          original="$(psql -U postgres -d schooldecider_migrations -Atc 'SELECT version_num FROM alembic_version')"
          restored="$(psql -U postgres -d schooldecider_restore -Atc 'SELECT version_num FROM alembic_version')"
          test -n "$original" && test "$original" = "$restored"
          original_rows="$(psql -U postgres -d schooldecider_migrations -Atc 'SELECT row_to_json(s)::text FROM schools s ORDER BY id')"
          restored_rows="$(psql -U postgres -d schooldecider_restore -Atc 'SELECT row_to_json(s)::text FROM schools s ORDER BY id')"
          test -n "$original_rows" && test "$original_rows" = "$restored_rows"

      - name: Run PostgreSQL-marked tests
        # The suite above runs on SQLite and skips these. They run on a migrated schema
        # of their own: the tests empty its tables before each test.
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/schooldecider_pgtests
          POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/schooldecider_pgtests
        run: |
          createdb -U postgres schooldecider_pgtests
          uv run alembic upgrade head
          uv run pytest -m postgres

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # This PR's calculator and fee code on today's live API data: a realistic parent must
      # still get an answer at most schools with the data (e2e/live/coverage.test.js).
      - name: Coverage for realistic parents
        run: npm run test:coverage || { echo "Retrying once in 30 seconds."; sleep 30; npm run test:coverage; }

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        # Downloads only on a cache miss; the system libraries are installed every time.
        run: npx playwright install --with-deps chromium

      - name: Run browser journeys
        # Search-page history journeys against the build above, with recorded API answers.
        run: npm run test:journeys
