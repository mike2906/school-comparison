name: Live flows

# Walks a parent's journeys on the live site in a real browser: the admission calculator,
# cut-offs and catchment check, school facts and open days, social links, fees with
# payment plans, compare, and schools without a verified pin. Each flow picks its school
# from the live API. Runs after every deploy and daily, so data changes are caught too.
# Read-only on the site. Runs stay green, so failures email nobody: each failed flow is an
# annotation, and a flow that fails two daily runs in a row opens a `live-check` issue that
# a scheduled session picks up; it closes when the flow passes (e2e/live/issues.js).
# Screenshots of failed flows are attached to the run. Flows: frontend/e2e/live/.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      site_url:
        description: Site to check
        type: string
        default: https://schooldecider.com
      api_url:
        description: API the site reads from
        type: string
        default: https://api.schooldecider.com

concurrency:
  group: live-flows
  # Queued, not cancelled: a later deploy or the daily run never drops a deploy's check.
  cancel-in-progress: false

permissions:
  contents: read
  # issues.js reads the previous daily run's failed flows and opens or closes issues.
  actions: read
  checks: read
  issues: write

jobs:
  flows:
    name: Parent journeys
    # After a deploy, only a successful one: a failed deploy rolled back and says so itself.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      LIVE_FAILED_LIST: ${{ github.workspace }}/../failed-flows.txt
    steps:
      # The flows of the commit the live site was built from (deploy.yml writes it to
      # version.txt): a docs-only push or a rolled-back deploy leaves main ahead of it.
      - name: Find the live commit
        id: live
        working-directory: .
        env:
          SITE: ${{ inputs.site_url || 'https://schooldecider.com' }}
        run: |
          sha="$(curl -fsS -m 20 -H 'Cache-Control: no-cache' "$SITE/version.txt?cb=$GITHUB_RUN_ID" 2>/dev/null | tr -d '[:space:]' || true)"
          # A manual run on a branch checks that branch's flows, to try a new flow before merging it.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            sha="$GITHUB_SHA"
          elif ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::$SITE/version.txt gave no commit; using $GITHUB_SHA."
            sha="$GITHUB_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.live.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        # A failed install is reported like a crash (issues.js), not as a red run.
        continue-on-error: true
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Flows
        id: flows
        if: steps.install.outcome == 'success'
        # Never red by itself: the Issues step reports what failed.
        continue-on-error: true
        env:
          LIVE_SITE_URL: ${{ inputs.site_url || 'https://schooldecider.com' }}
          LIVE_API_URL: ${{ inputs.api_url || 'https://api.schooldecider.com' }}
        # One retry, so a single slow answer does not page anyone. Each flow that fails the
        # retry too is an annotation on the run's page.
        run: npm run test:live:ci || { echo "Retrying once in 60 seconds."; sleep 60; LIVE_LAST_TRY=1 npm run test:live:ci; }

      # Open or close `live-check` issues (daily runs only); the run stays green.
      - name: Issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIVE_FLOWS_OUTCOME: ${{ steps.flows.outcome }}
        # A live commit from before this script existed has none: any failure is red.
        run: |
          if [ -f e2e/live/issues.js ]; then node e2e/live/issues.js "$LIVE_FAILED_LIST"
          else [ "$LIVE_FLOWS_OUTCOME" = success ]; fi

      - name: Upload screenshots
        if: always() && steps.flows.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: live-flows-report
          path: frontend/live-flows-report/
          if-no-files-found: ignore
