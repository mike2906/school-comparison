name: Watch admission rules

# Checks the official sources behind frontend/src/admission/rules (council sessions and
# consultations, the ИСОДЗ calendar, МОН drafts) and opens a `rule-watch` issue when one
# changes, or when a campaign's rule file is missing or still provisional past its date.
# State lives on the rule-watch-data branch. Docs: docs/ADMISSION_POINTS.md
on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      issues:
        description: Open issues for what is found
        type: boolean
        default: true

concurrency:
  group: watch-admission-rules
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  watch:
    name: Rule sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check out the watch state
        uses: actions/checkout@v7
        with:
          ref: rule-watch-data
          path: rule-watch-state

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        working-directory: backend
        run: uv sync --locked

      - name: Watch
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python -m scripts.watch_admission_rules
          --state ../rule-watch-state
          --rules ../frontend/src/admission/rules
          ${{ (github.event_name == 'schedule' || inputs.issues) && '--issues' || '' }}

      - name: Save the watch state
        working-directory: rule-watch-state
        run: |
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="rule watch" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Rule watch $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:rule-watch-data

      # A failed run means changes are not being noticed: say so where the findings go.
      # One open issue at a time; later failures add a comment.
      - name: Report a failed run
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Rule watch: the daily run failed"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label rule-watch --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          body="The admission rule watch failed, so source changes are not being noticed until it runs again: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create rule-watch --repo "$GITHUB_REPOSITORY" --color d4c5f9 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label rule-watch --body "$body"
          fi
