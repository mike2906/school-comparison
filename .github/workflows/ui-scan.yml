name: UI scan

# Opens every school page (plus search, about and compare) in Bulgarian and English at
# phone width and reports raw translation keys, leaked NaN/undefined, overflowing text,
# lev or implausible prices, wrong-language labels, console errors and failed requests.
# Read-only. GitHub emails the repository owner when a scheduled run finds something;
# the report and screenshots are attached to the run. Script: frontend/scripts/ui-scan.js
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      site_url:
        description: Site to scan
        type: string
        default: https://schooldecider.com
      api_url:
        description: API the site reads from
        type: string
        default: https://api.schooldecider.com

concurrency:
  group: ui-scan
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Phone-width scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Scan
        env:
          SCAN_SITE_URL: ${{ inputs.site_url || 'https://schooldecider.com' }}
          SCAN_API_URL: ${{ inputs.api_url || 'https://api.schooldecider.com' }}
        run: npm run scan:ui

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-scan-report
          path: frontend/ui-scan-report/
          if-no-files-found: ignore
