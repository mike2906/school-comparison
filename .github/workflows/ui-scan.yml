name: UI scan

# Opens every school page (plus search, about and compare) in Bulgarian and English at
# phone width and reports raw translation keys, leaked NaN/undefined, overflowing text,
# lev or implausible prices, wrong-language labels, console errors and failed requests.
# Read-only on the site. Findings do not turn the run red (that emailed every week): they
# go into one open `ui-scan` issue, updated each run and closed when a scan is clean, which
# the daily live-check session picks up. The report and screenshots are attached to the run.
# Red only when the scan itself crashes. Script: frontend/scripts/ui-scan.js
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      site_url:
        description: Site to scan
        type: string
        default: https://schooldecider.com
      api_url:
        description: API the site reads from
        type: string
        default: https://api.schooldecider.com

concurrency:
  group: ui-scan
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: Phone-width scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Scan
        env:
          SCAN_SITE_URL: ${{ inputs.site_url || 'https://schooldecider.com' }}
          SCAN_API_URL: ${{ inputs.api_url || 'https://api.schooldecider.com' }}
        id: scan
        # Exit 1 means findings (reported in the issue below); anything else is a crash.
        run: |
          set +e
          npm run scan:ui
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -le 1 ]

      - name: Issue
        # The live site and API from main only: any other scan reports in its own run.
        if: >-
          always() && steps.scan.outputs.code != '' && github.ref == 'refs/heads/main' &&
          (inputs.site_url == '' || inputs.site_url == 'https://schooldecider.com') &&
          (inputs.api_url == '' || inputs.api_url == 'https://api.schooldecider.com')
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.scan.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label ui-scan --state open --json number --jq '.[0].number // empty')"
          if [ "$CODE" = 1 ] && [ ! -f ui-scan-report/report.md ]; then
            echo "::error title=UI scan::Exit 1 with no report: the scan crashed."; exit 1
          fi
          if [ "$CODE" = 1 ]; then
            { echo "The weekly phone-width scan ($RUN_URL) found the problems below. Fix each at its root (a site bug, a data error, or a check reading the page too narrowly); screenshots are attached to the run. This issue is updated by every scan and closes when one is clean."; echo; head -c 60000 ui-scan-report/report.md | iconv -f utf-8 -t utf-8 -c
              [ "$(wc -c < ui-scan-report/report.md)" -le 60000 ] || printf '\n\n_Cut short: the full report is attached to the run._\n'; } > body.md
            if [ -n "$number" ]; then gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
            else gh label create ui-scan --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" --label ui-scan --title "UI scan findings" --body-file body.md; fi
          elif [ "$CODE" = 0 ] && [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The scan $RUN_URL found nothing. Closing."
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-scan-report
          path: frontend/ui-scan-report/
          if-no-files-found: ignore
