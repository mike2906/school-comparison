# Fees eval: the fee reader on saved pages, scored against the blind answer keys
# (backend/scripts/fees_eval.py). Runs on a PR that touches the reader, its checks, the
# publish gate or the model choice when it is opened, reopened or marked ready, and again when the
# `fees-eval` label is added; not on every push. About $0.15 a run (3 trials). At most
# MAX_RUNS_PER_DAY PR runs a day (UTC), each stopped at $0.30 (about $1 a day, $1.80 at most): past that a PR
# run fails without calling the model, and the label runs it the next day. A run by hand is not capped.
name: Fees eval

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
    paths:
      - backend/app/scrapers/extraction/agent_fees.py
      - backend/app/scrapers/extraction/price_step.py
      - backend/app/scrapers/stages/fees_agent.py
      - backend/app/ai/client.py
      - backend/app/config.py
      - backend/app/models/pricing.py
      - backend/app/scrapers/fee_pages.py
      - backend/app/scrapers/extraction/text_values.py
      - backend/app/scrapers/extraction/llm_results.py
      - backend/app/utils/display_gating.py
      - backend/scripts/fees_eval.py
      - backend/evals/fees/**
      - docs/accuracy/step3/**
      - docs/accuracy/step4/**
      - docs/accuracy/cases/**
      - .github/workflows/fees-eval.yml
  workflow_dispatch:
    inputs:
      model:
        description: "Pricing model to try instead of the default (e.g. openrouter/...); the baseline check is skipped"
        required: false
        default: ""
      trials:
        description: "Trials"
        required: false
        default: "3"

permissions:
  contents: read
  actions: read  # the daily cap counts today's runs

concurrency:
  # Another label gets a group of its own, so it can't cancel an eval that is running.
  group: fees-eval-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'fees-eval') && github.run_id || 'eval' }}
  cancel-in-progress: true

jobs:
  eval:
    name: Fees eval
    # A label other than fees-eval, or a draft PR, skips the eval (no model calls).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       (github.event.action != 'labeled' || github.event.label.name == 'fees-eval'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MODEL_TIER_PRICING: ${{ inputs.model }}
      MAX_RUNS_PER_DAY: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Skip without a key
        id: key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::notice::No OPENROUTER_API_KEY secret (or a fork's PR): fees eval skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Daily cap
        id: cap
        if: steps.key.outputs.skip != 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PR runs started today (UTC), each attempt of a re-run counted; this one left out.
          # Skipped runs (a draft, another label) called no model; cancelled ones may have, so
          # they count. A run that failed before the model counts too: the cap errs toward less spend.
          ran="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fees-eval.yml/runs?event=pull_request&per_page=100" \
            -q "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"skipped\")
                 | select(.run_started_at >= \"$(date -u +%F)\") | .run_attempt] | add // 0")"
          echo "Fees eval PR runs today before this one: $ran of $MAX_RUNS_PER_DAY"
          if [ "$ran" -ge "$MAX_RUNS_PER_DAY" ]; then
            msg="The fees eval already ran $ran times today (UTC), its daily cap, so it did not run. To run it on this PR tomorrow, remove the fees-eval label if it is on, then add it."
            echo "::error::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Install uv
        if: steps.key.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        if: steps.key.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.key.outputs.skip != 'true'
        run: uv sync --locked

      - name: Run the eval
        id: eval
        if: steps.key.outputs.skip != 'true'
        env:
          TRIALS: ${{ inputs.trials || '3' }}
          # A PR run costs about $0.15; a run by hand may use more trials.
          MAX_USD: ${{ github.event_name == 'pull_request' && '0.30' || '1.00' }}
        run: |
          set -o pipefail
          check=""
          if [ -n "$MODEL_TIER_PRICING" ]; then check="--no-check"; fi  # the baseline is the default model's
          uv run python scripts/fees_eval.py --trials "$TRIALS" --max-usd "$MAX_USD" $check \
            --out "$RUNNER_TEMP/fees-eval.json" | tee "$RUNNER_TEMP/fees-eval.txt"

      - name: Summary
        if: always() && steps.eval.outcome != 'skipped' && steps.key.outputs.skip != 'true'
        run: |
          { echo '```'; cat "$RUNNER_TEMP/fees-eval.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always() && steps.key.outputs.skip != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: fees-eval
          path: ${{ runner.temp }}/fees-eval.json
          if-no-files-found: ignore
