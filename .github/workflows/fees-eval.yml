# Fees eval: the fee reader on saved pages, scored against the blind answer keys
# (backend/scripts/fees_eval.py). Runs only when a PR touches the reader, its checks, the
# publish gate or the model choice; about $0.002 per school per trial. A draft PR skips it:
# open fee PRs as drafts and mark them ready once the fixes are in, so it runs once rather
# than on every push (2026-10-16: 34 runs in one day spent most of the OpenRouter credit).
name: Fees eval

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - backend/app/scrapers/extraction/agent_fees.py
      - backend/app/scrapers/extraction/price_step.py
      - backend/app/scrapers/stages/fees_agent.py
      - backend/app/ai/client.py
      - backend/app/config.py
      - backend/app/models/pricing.py
      - backend/app/scrapers/fee_pages.py
      - backend/app/scrapers/extraction/text_values.py
      - backend/app/scrapers/extraction/llm_results.py
      - backend/app/utils/display_gating.py
      - backend/scripts/fees_eval.py
      - backend/evals/fees/**
      - docs/accuracy/step3/**
      - docs/accuracy/step4/**
      - docs/accuracy/cases/**
      - .github/workflows/fees-eval.yml
  workflow_dispatch:
    inputs:
      model:
        description: "Pricing model to try instead of the default (e.g. openrouter/...); the baseline check is skipped"
        required: false
        default: ""
      trials:
        description: "Trials"
        required: false
        default: "3"

permissions:
  contents: read

# A newer push waits for the running eval instead of cancelling it: a cancelled run has
# already paid for most of its calls. Pushes in between are skipped; only the latest runs.
concurrency:
  group: fees-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    name: Fees eval
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MODEL_TIER_PRICING: ${{ inputs.model }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Skip without a key
        id: key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::notice::No OPENROUTER_API_KEY secret (or a fork's PR): fees eval skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.key.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        if: steps.key.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.key.outputs.skip != 'true'
        run: uv sync --locked

      - name: Run the eval
        if: steps.key.outputs.skip != 'true'
        env:
          TRIALS: ${{ inputs.trials || '3' }}
        run: |
          set -o pipefail
          check=""
          if [ -n "$MODEL_TIER_PRICING" ]; then check="--no-check"; fi  # the baseline is the default model's
          uv run python scripts/fees_eval.py --trials "$TRIALS" --max-usd 1.00 $check \
            --out "$RUNNER_TEMP/fees-eval.json" | tee "$RUNNER_TEMP/fees-eval.txt"

      - name: Summary
        if: always() && steps.key.outputs.skip != 'true'
        run: |
          { echo '```'; cat "$RUNNER_TEMP/fees-eval.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always() && steps.key.outputs.skip != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: fees-eval
          path: ${{ runner.temp }}/fees-eval.json
          if-no-files-found: ignore
