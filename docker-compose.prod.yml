# Production stack: Caddy (HTTPS) -> API -> Postgres. The local dev stack is
# docker-compose.yml. Settings come from deploy/.env (see deploy/.env.example):
#   docker compose --env-file deploy/.env -f docker-compose.prod.yml up -d
# Runbook: deploy/README.md
name: schooldecider

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schools
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: schools
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schools -d schools"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *logging

  api:
    build: ./backend
    image: ${API_IMAGE:-schooldecider-api:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://schools:${POSTGRES_PASSWORD}@postgres:5432/schools
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in deploy/.env}
      DEBUG: "false"
      PUBLISH_SUMMARIES: ${PUBLISH_SUMMARIES:-false}
      PUBLISH_WEBSITE_ADMISSION_FIELDS: ${PUBLISH_WEBSITE_ADMISSION_FIELDS:-false}
      PUBLISH_WEBSITE_DYNAMIC_FIELDS: ${PUBLISH_WEBSITE_DYNAMIC_FIELDS:-false}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
    # Liveness only (/health has no dependencies); /ready is for smoke tests and uptime checks.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?set API_HOST in deploy/.env}
      CADDY_TLS: ${CADDY_TLS:?set CADDY_TLS in deploy/.env}
    # IPv4 only: the host firewall (deploy/firewall.sh) has no IPv6 rules, and a port
    # published without a host address is also reachable over IPv6.
    ports:
      - target: 80
        published: "${HTTP_PORT:-80}"
        host_ip: 0.0.0.0
      - target: 443
        published: "${HTTPS_PORT:-443}"
        host_ip: 0.0.0.0
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/cloudflare-proxies.caddy:/etc/caddy/cloudflare-proxies.caddy:ro
      - ${ORIGIN_CERT_DIR:-./deploy/certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
