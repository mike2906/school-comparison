use_default_settings: true

general:
  instance_name: "Sofia School Search"

server:
  # Local dev only: disable limiter so API-style curl/httpx calls are not blocked.
  limiter: false
  public_instance: false

search:
  # We need JSON for scraper integration.
  formats:
    - html
    - json

engines:
  # Google, DuckDuckGo, Startpage, Brave and Qwant all refused this PC on 2026-11-06
  # ("access denied", CAPTCHAs); Yandex answered Bulgarian school searches well
  # (dg136.com for "ДГ 136 София"). It is off in SearXNG's defaults.
  - name: yandex
    disabled: false
