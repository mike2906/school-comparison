services:
  postgres:
    image: postgres:16-alpine
    container_name: sofia_schools_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sofia_schools
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: sofia_schools_searxng
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      BASE_URL: http://localhost:8080/
      INSTANCE_NAME: Sofia School Search
      SEARXNG_LIMITER: "false"
      # Set in local .env (gitignored). Fallback avoids SearXNG default crash loop.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-replace-this-local-searxng-secret}
    restart: unless-stopped

volumes:
  postgres_data:
